<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c10" />
  <title>Paws & Pantry · Gemini Agent Team Demo</title>
  <meta name="description" content="Paws & Pantry: interactive Gemini agent team demo (sample, illustrative data)." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="sparkle-grad" x1="0" y1="24" x2="24" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#1C7DFF" />
        <stop offset="0.45" stop-color="#4E8CF7" />
        <stop offset="0.75" stop-color="#9B72F2" />
        <stop offset="1" stop-color="#D96570" />
      </linearGradient>
      <symbol id="sparkle" viewBox="0 0 24 24">
        <path d="M12 0C12.6 6.4 17.6 11.4 24 12C17.6 12.6 12.6 17.6 12 24C11.4 17.6 6.4 12.6 0 12C6.4 11.4 11.4 6.4 12 0Z" fill="url(#sparkle-grad)" />
      </symbol>
    </defs>
  </svg>
  <div class="bg-glow" aria-hidden="true"><span class="g1"></span><span class="g2"></span><span class="g3"></span></div>
  <div class="bg-grain" aria-hidden="true"></div>
  <div id="app">
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <svg class="brand-mark" width="22" height="22" aria-hidden="true"><use href="#sparkle" /></svg>
          <span class="brand-name">Gemini</span>
        </div>
        <div class="progress" id="progress" aria-label="Setup progress"></div>
      </div>
    </header>

    <main class="stage" id="stage"></main>

    <footer class="navfoot" id="navfoot">
      <div class="navfoot-inner">
        <button type="button" class="btn btn-ghost" id="btn-back">Back</button>
        <div class="navfoot-hint" id="nav-hint"></div>
        <button type="button" class="btn btn-primary" id="btn-next">Next</button>
      </div>
    </footer>
  </div>

  <!-- Welcome splash (sample) -->
  <div class="splash" id="splash" role="dialog" aria-labelledby="splash-title">
    <div class="splash-inner">
      <svg class="splash-mark" width="44" height="44" aria-hidden="true"><use href="#sparkle" /></svg>
      <h1 class="splash-title" id="splash-title">Welcome back, <span id="splash-name">Alex</span></h1>
      <p class="splash-sub">Let's set up a team that runs <span id="splash-biz">Paws &amp; Pantry</span> with you.</p>
      <button type="button" class="btn btn-primary" id="splash-start">Get started</button>
      <p class="splash-note">Sales demo · sample, illustrative data</p>
    </div>
  </div>

  <!-- Learning how you work (runs after connectors) -->
  <div class="launch-overlay" id="launch-overlay" hidden>
    <div class="learn" role="dialog" aria-labelledby="learn-title" aria-live="polite">
      <div class="learn-eyebrow">Getting to know you</div>
      <h2 class="learn-title" id="learn-title">Learning how you work.</h2>
      <p class="learn-status" id="learn-status">Getting started…</p>
      <div class="learn-icons" id="learn-icons"></div>
      <ul class="learn-facts" id="learn-facts"></ul>
      <ul class="learn-team" id="launch-list"></ul>
      <button type="button" class="btn btn-primary" id="learn-continue" hidden>Go to my dashboard</button>
      <p class="learn-note">Sample facts for Paws &amp; Pantry · illustrative, not read from real accounts</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
